# Publishes the static prototype (src/site) to GitHub Pages, with the pitch deck and demo video under /docs/.
# The Node backend is not deployed here, so the site uses its built-in offline fallbacks.
name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/docs
          cp -r src/site/. _site/
          cp -r docs/deck docs/deck-images docs/demo _site/docs/
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
      - name: Configure GitHub Pages (for GitHub Actions mode)
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site
      - name: Deploy via GitHub Actions Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
